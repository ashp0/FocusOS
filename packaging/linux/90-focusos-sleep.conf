# FocusOS systemd sleep drop-in (/etc/systemd/sleep.conf.d/).
#
# Goal: when FocusOS opts into a whole-machine suspend for the deep-idle sleep
# (the deep_sleep_suspend setting), the machine must come back cleanly. Plain S3
# suspend-to-RAM black-screens some hardware on wake (notably the 2017 iMac:
# the panel powers on but stays blank). suspend-to-idle ("s2idle" / "freeze")
# keeps the display controller in a lighter state and resumes reliably, at the
# cost of a little more idle power — which the FocusOS process-freeze already
# minimises.
#
# This pins `systemctl suspend` (what LinuxBackend::suspendSystem() issues) to
# the freeze state. The default, safe FocusOS deep sleep does NOT suspend at all
# (it freezes user processes + blanks the panel); this only matters when the
# user explicitly enables deep_sleep_suspend.

[Sleep]
# s2idle instead of S3: safe wake on hardware that can't resume from deep.
SuspendState=freeze
