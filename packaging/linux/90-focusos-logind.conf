# FocusOS systemd-logind lockdown drop-in (/etc/systemd/logind.conf.d/).
#
# Goals:
#   * The power button must NOT shut the machine down (Task 6). Instead it locks
#     the session — logind emits the session "Lock" signal, which FocusOS wires
#     to its screen-lock (see main.cpp / RoutineManager::lockScreen). A long
#     press still powers off as a deliberate hardware escape.
#   * No spare VTs / getty escape surfaces (the installer also masks the gettys).
#   * Closing the lid locks rather than suspends mid-routine.

[Login]
# Power key → lock the session (FocusOS blanks the screen). Long-press → power
# off, kept as an intentional hardware escape hatch.
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff

# Lid → lock instead of suspend so a routine isn't interrupted by a stray close.
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore

# Suspend / hibernate keys also just lock.
HandleSuspendKey=lock
HandleHibernateKey=lock

# Keep the user's session processes (FocusOS, the watchdog, routine apps) alive
# across login churn; the respawn watchdog owns lifecycle, not logind.
KillUserProcesses=no

# No reserved/auto VTs — removes the Ctrl+Alt+F<n> TTY escape (the installer
# additionally masks getty@/autovt@).
NAutoVTs=0
ReserveVT=0
